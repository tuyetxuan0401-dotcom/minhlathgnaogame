<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Bullet Clone - Game Bắn Súng Nảy Đạn</title>
    <style>
        body { margin: 0; background: #1a1a2e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        h1 { margin-bottom: 10px; color: #e94560; }
        #gameContainer { position: relative; border: 4px solid #fff; border-radius: 8px; overflow: hidden; background: #162447; }
        canvas { display: block; cursor: crosshair; }
        #ui { position: absolute; top: 10px; left: 10px; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; font-weight: bold; text-align: center; display: none; text-shadow: 2px 2px 4px #000; }
        button { margin-top: 15px; padding: 10px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; background: #e94560; color: white; cursor: pointer; }
        button:hover { background: #ff6b81; }
    </style>
</head>
<body>

    <h1>MR BULLET CLONE</h1>
    <div id="gameContainer">
        <div id="ui">Đạn còn lại: <span id="ammoText">3</span></div>
        <div id="msg"></div>
        <canvas id="gameCanvas" width="480" height="600"></canvas>
    </div>
    <button onclick="resetGame()">Chơi Lại Vòng Này</button>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const ammoText = document.getElementById("ammoText");
const msg = document.getElementById("msg");

// Cấu hình trò chơi
let ammo = 3;
let gameOver = false;
let bullets = [];

// Nhân vật Mr Bullet (Màu xanh)
const player = { x: 60, y: 480, width: 30, height: 50 };

// Kẻ địch (Màu đỏ)
let enemies = [
    { x: 380, y: 200, width: 30, height: 50, alive: true }
];

// Các bức tường chắn để đạn nảy (Màu xám)
const walls = [
    { x: 220, y: 0, width: 40, height: 350 }, // Tường chắn ở giữa từ trên xuống
    { x: 0, y: 530, width: 480, height: 70 }   // Mặt đất
];

// Lắng nghe sự kiện click chuột để bắn
canvas.addEventListener("mousedown", (e) => {
    if (gameOver || ammo <= 0) return;

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    // Tính góc bắn từ súng của người chơi đến vị trí chuột
    const angle = Math.atan2(mouseY - (player.y + 15), mouseX - (player.x + 30));
    
    // Tạo viên đạn bay đi
    bullets.push({
        x: player.x + 30,
        y: player.y + 15,
        vx: Math.cos(angle) * 10,
        vy: Math.sin(angle) * 10,
        radius: 5,
        bounces: 0
    });

    ammo--;
    ammoText.innerText = ammo;
});

function resetGame() {
    ammo = 3;
    ammoText.innerText = ammo;
    gameOver = false;
    msg.style.display = "none";
    bullets = [];
    enemies.forEach(e => e.alive = true);
}

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

// Vòng lặp cập nhật game
function update() {
    // Di chuyển và xử lý va chạm của đạn
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // Va chạm với tường biên trái/phải -> Nảy lại
        if (b.x - b.radius < 0 || b.x + b.radius > canvas.width) {
            b.vx *= -1;
            b.bounces++;
        }
        // Va chạm với trần nhà -> Nảy xuống
        if (b.y - b.radius < 0) {
            b.vy *= -1;
            b.bounces++;
        }

        // Va chạm với các chướng ngại vật (walls)
        walls.forEach(w => {
            let bulletRect = { x: b.x - b.radius, y: b.y - b.radius, width: b.radius * 2, height: b.radius * 2 };
            if (checkCollision(bulletRect, w)) {
                // Kiểm tra va chạm hướng nào để nảy hướng đó
                if (b.x < w.x || b.x > w.x + w.width) b.vx *= -1;
                else b.vy *= -1;
                b.bounces++;
            }
        });

        // Va chạm trúng kẻ địch
        enemies.forEach(e => {
            if (e.alive) {
                let bulletRect = { x: b.x - b.radius, y: b.y - b.radius, width: b.radius * 2, height: b.radius * 2 };
                if (checkCollision(bulletRect, e)) {
                    e.alive = false; // Kẻ địch chết
                    bullets.splice(i, 1); // Xóa viên đạn
                }
            }
        });

        // Xóa đạn nếu nảy quá 5 lần hoặc bay ra ngoài màn hình ở dưới
        if (b.bounces > 5 || b.y > canvas.height) {
            bullets.splice(i, 1);
        }
    }

    // Kiểm tra trạng thái Thắng / Thua
    let allDead = enemies.every(e => !e.alive);
    if (allDead && !gameOver) {
        gameOver = true;
        msg.innerHTML = "<span style='color: #4caf50;'>CHIẾN THẮNG!<br>Bạn thật thiên tài!</span>";
        msg.style.display = "block";
    } else if (!allDead && ammo === 0 && bullets.length === 0 && !gameOver) {
        gameOver = true;
        msg.innerHTML = "<span style='color: #f44336;'>THẤT BẠI!<br>Hết đạn rồi!</span>";
        msg.style.display = "block";
    }
}

// Vẽ đồ họa lên màn hình
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ mặt đất và các bức tường chắn
    ctx.fillStyle = "#4e5166";
    walls.forEach(w => ctx.fillRect(w.x, w.y, w.width, w.height));

    // Vẽ người chơi Mr Bullet (Màu xanh dương)
    ctx.fillStyle = "#2196f3";
    ctx.fillRect(player.x, player.y, player.width, player.height);
    // Vẽ kính đen ngầu
    ctx.fillStyle = "#000";
    ctx.fillRect(player.x + 15, player.y + 10, 15, 8);

    // Vẽ kẻ địch (Màu đỏ)
    enemies.forEach(e => {
        if (e.alive) {
            ctx.fillStyle = "#f44336";
            ctx.fillRect(e.x, e.y, e.width, e.height);
            // Kính đen kẻ địch
            ctx.fillStyle = "#000";
            ctx.fillRect(e.x, e.y + 10, 15, 8);
        }
    });

    // Vẽ đạn (Màu vàng tròn)
    ctx.fillStyle = "#ffeb3b";
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
