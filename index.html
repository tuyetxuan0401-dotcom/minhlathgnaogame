<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darling - The Rock Sát Thủ Diệt Trump</title>
    <style>
        body { margin: 0; background: #0f0c1b; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        h1 { margin: 5px 0; color: #b55fe6; font-size: 26px; text-shadow: 0 0 10px rgba(181, 95, 230, 0.5); }
        #gameContainer { position: relative; border: 4px solid #b55fe6; border-radius: 12px; overflow: hidden; background: #16122c; box-shadow: 0 0 30px rgba(0, 0, 0, 0.7); }
        canvas { display: block; cursor: crosshair; background: #16122c; }
        #ui { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
        .stat-box { background: rgba(0,0,0,0.7); padding: 5px 12px; border-radius: 6px; border: 1px solid #443c6c; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; font-weight: bold; text-align: center; display: none; text-shadow: 3px 3px 6px #000; background: rgba(0, 0, 0, 0.9); padding: 20px 20px; border-radius: 10px; border: 2px solid #fff; width: 85%; box-sizing: border-box; z-index: 20; }
        .btn-container { margin-top: 15px; display: flex; gap: 10px; }
        button { padding: 10px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; background: #e94560; color: white; cursor: pointer; transition: 0.2s; }
        button:hover { background: #ff6b81; transform: scale(1.05); }
        button.next-btn { background: #4caf50; }
        button.next-btn:hover { background: #66bb6a; }
    </style>
</head>
<body>

    <h1>SÁT THỦ DARLING (THE ROCK)</h1>
    <div id="gameContainer">
        <div id="ui">
            <div class="stat-box">Màn chơi: <span id="levelText">1</span> / 369</div>
            <div class="stat-box">Số đạn: <span id="ammoText">10</span> 💣</div>
        </div>
        <div id="msg"></div>
        <canvas id="gameCanvas" width="500" height="650"></canvas>
    </div>
    <div class="btn-container">
        <button onclick="resetLevel()">Chơi Lại Màn Này</button>
        <button id="nextBtn" class="next-btn" onclick="nextLevel()" style="display:none;">Qua Màn Tiếp Theo</button>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const levelText = document.getElementById("levelText");
const ammoText = document.getElementById("ammoText");
const msg = document.getElementById("msg");
const nextBtn = document.getElementById("nextBtn");

let currentLevel = 1;
let ammo = 10;
let gameOver = false;
let gameWon = false;
let bullets = [];
let mouseX = 250;
let mouseY = 325;

const player = { x: 50, y: 500, width: 40, height: 70 };
let enemy = { x: 400, y: 200, width: 40, height: 70, alive: true };
let walls = [];

canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

canvas.addEventListener("mousedown", (e) => {
    if (gameOver || gameWon || ammo <= 0) return;

    const gunX = player.x + player.width;
    const gunY = player.y + 25;
    const angle = Math.atan2(mouseY - gunY, mouseX - gunX);
    
    bullets.push({
        x: gunX,
        y: gunY,
        vx: Math.cos(angle) * 12,
        vy: Math.sin(angle) * 12,
        radius: 6,
        bounces: 0
    });

    ammo--;
    ammoText.innerText = ammo;
});

function generateLevel(lvl) {
    ammo = 10;
    ammoText.innerText = ammo;
    gameOver = false;
    gameWon = false;
    msg.style.display = "none";
    nextBtn.style.display = "none";
    bullets = [];
    enemy.alive = true;
    levelText.innerText = lvl;

    walls = [{ x: 0, y: 580, width: 500, height: 70 }];

    // Thuật toán đổi vị trí Donald Trump
    enemy.x = 340 + (Math.sin(lvl * 10) * 50);
    enemy.y = 420 - ((lvl % 4) * 60);

    // Thuật toán đổi kiểu chướng ngại vật theo màn
    if (lvl % 3 === 1) {
        walls.push({ x: 230, y: 180, width: 40, height: 220 });
    } else if (lvl % 3 === 2) {
        walls.push({ x: 180, y: 320, width: 180, height: 30 });
    } else {
        walls.push({ x: 220, y: 120, width: 40, height: 180 });
        walls.push({ x: 300, y: 380, width: 100, height: 30 });
    }
}

function resetLevel() {
    generateLevel(currentLevel);
}

function nextLevel() {
    if (currentLevel < 369) {
        currentLevel++;
        generateLevel(currentLevel);
    } else {
        msg.innerHTML = "<span style='color: #ffeb3b;'>BẠN ĐÃ PHÁ ĐẢO TOÀN BỘ 369 MÀN CHƠI!</span>";
        msg.style.display = "block";
    }
}

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

function update() {
    if (gameOver || gameWon) return;

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x - b.radius < 0 || b.x + b.radius > canvas.width) {
            b.vx *= -1;
            b.bounces++;
        }
        if (b.y - b.radius < 0) {
            b.vy *= -1;
            b.bounces++;
        }

        walls.forEach(w => {
            let bulletRect = { x: b.x - b.radius, y: b.y - b.radius, width: b.radius * 2, height: b.radius * 2 };
            if (checkCollision(bulletRect, w)) {
                if (b.x < w.x || b.x > w.x + w.width) b.vx *= -1;
                else b.vy *= -1;
                b.bounces++;
            }
        });

        if (enemy.alive) {
            let bulletRect = { x: b.x - b.radius, y: b.y - b.radius, width: b.radius * 2, height: b.radius * 2 };
            if (checkCollision(bulletRect, enemy)) {
                enemy.alive = false;
                bullets.splice(i, 1);
            }
        }

        if (b.bounces > 6 || b.y > canvas.height) {
            bullets.splice(i, 1);
        }
    }

    if (!enemy.alive && !gameWon) {
        gameWon = true;
        msg.innerHTML = "<span style='color: #4caf50;'>chúc mừng thằng da đen trước màn hình</span>";
        msg.style.display = "block";
        nextBtn.style.display = "inline-block";
    } else if (enemy.alive && ammo === 0 && bullets.length === 0 && !gameOver) {
        gameOver = true;
        msg.innerHTML = "<span style='color: #f44336;'>bắn như tật</span>";
        msg.style.display = "block";
    }
}

function draw() {
    ctx.fillStyle = "#16122c";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Vẽ tường chắn
    ctx.fillStyle = "#342a56";
    walls.forEach(w => {
        ctx.fillRect(w.x, w.y, w.width, w.height);
        ctx.strokeStyle = "#443c6c";
        ctx.strokeRect(w.x, w.y, w.width, w.height);
    });

    // Vẽ tia laser đỏ ngắm súng
    if (!gameOver && !gameWon && ammo > 0) {
        ctx.strokeStyle = "rgba(255, 0, 0, 0.8)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(player.x + player.width, player.y + 25);
        ctx.lineTo(mouseX, mouseY);
        ctx.stroke();
    }

    // Vẽ The Rock (Darling da tím)
    ctx.fillStyle = "#8a2be2";
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = "#6a1b9a";
    ctx.fillRect(player.x + player.width - 5, player.y + 20, 12, 12); 
    ctx.fillStyle = "#a142f4";
    ctx.beginPath();
    ctx.arc(player.x + player.width/2, player.y - 12, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.fillRect(player.x + player.width/2 - 2, player.y - 15, 16, 6);

    // Vẽ Donald Trump (Áo xanh, mặt cam, tóc vàng)
    if (enemy.alive) {
        ctx.fillStyle = "#0d47a1"; 
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
        ctx.fillStyle = "#ffb74d";
        ctx.beginPath();
        ctx.arc(enemy.x + enemy.width/2, enemy.y - 12, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffd54f";
        ctx.beginPath();
        ctx.moveTo(enemy.x + 2, enemy.y - 24);
        ctx.lineTo(enemy.x + enemy.width - 2, enemy.y - 24);
        ctx.lineTo(enemy.x + enemy.width/2 + 8, enemy.y - 34);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#d32f2f";
        ctx.fillRect(enemy.x + enemy.width/2 - 3, enemy.y, 6, 18);
    }

    // Vẽ viên đạn
    ctx.fillStyle = "#ffeb3b";
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

generateLevel(currentLevel);
gameLoop();
</script>
</body>
</html>
