<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trump vs Putin - Click Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #54ddd2;
    overflow-x: hidden;
}

.header {
    height: 75px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    box-shadow: 0 3px 10px #0003;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    color: #0d4775;
}

.info {
    display: flex;
    gap: 30px;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
}

button {
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    background: #ff4757;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

/* GAME */
#game {
    position: relative;
    width: 900px;
    max-width: 95%;
    height: 560px;
    margin: 20px auto;
    overflow: hidden;
    border-radius: 15px;

    background:
        linear-gradient(
            #62b4e8 0%,
            #a7d8f2 65%,
            #83bd67 65%,
            #83bd67 100%
        );

    box-shadow: 0 10px 30px #0005;
}

/* Buildings */

.building {
    position: absolute;
    bottom: 0;
    width: 180px;
    height: 390px;
    background: #d8d2c8;
    border: 5px solid #777;
}

.left-building {
    left: 20px;
}

.right-building {
    right: 20px;
    height: 430px;
    background: #c8d8e1;
}

.window {
    position: absolute;
    width: 32px;
    height: 48px;
    background: #73bde5;
    border: 4px solid white;
}

/* CHARACTERS */

.character {
    position: absolute;
    bottom: 35px;
    width: 180px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: transform .12s;
}

.character:hover {
    transform: scale(1.08);
}

.trump {
    left: 250px;
}

.putin {
    right: 250px;
}

.face {
    width: 105px;
    height: 105px;
    margin: auto;
    border-radius: 50%;
    border: 6px solid white;
    box-shadow: 0 6px 15px #0005;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 55px;
    font-weight: 900;
}

/* màu tóc / khuôn mặt tượng trưng */

.trump .face {
    background: #f4c49b;
}

.putin .face {
    background: #e6b995;
}

.name {
    margin-top: 8px;
    background: white;
    border-radius: 10px;
    padding: 8px;
    font-size: 19px;
    font-weight: bold;
}

/* TARGET */

.target {
    position: absolute;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 4px solid white;

    background: #ffca28;

    box-shadow: 0 4px 12px #0006;

    cursor: pointer;

    animation: pop .2s ease;
}

@keyframes pop {
    from {
        transform: scale(.2);
    }

    to {
        transform: scale(1);
    }
}

/* GAME OVER */

#gameOver {
    position: absolute;
    inset: 0;

    background: #0009;

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 100;
}

.result {
    background: white;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    min-width: 300px;
}

.result h2 {
    font-size: 35px;
    margin-top: 0;
}

.instructions {
    text-align: center;
    font-size: 17px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="header">

    <div class="logo">
        🎯 CLICK ARENA
    </div>

    <div class="info">
        <div>
            Điểm:
            <span id="score">0</span>
        </div>

        <div>
            ⏱
            <span id="time">30</span>s
        </div>

        <button onclick="startGame()">
            BẮT ĐẦU
        </button>
    </div>

</div>


<div id="game">

    <!-- BUILDINGS -->

    <div class="building left-building">

        <div class="window" style="top:50px;left:25px"></div>
        <div class="window" style="top:50px;right:25px"></div>

        <div class="window" style="top:130px;left:25px"></div>
        <div class="window" style="top:130px;right:25px"></div>

        <div class="window" style="top:210px;left:25px"></div>
        <div class="window" style="top:210px;right:25px"></div>

    </div>


    <div class="building right-building">

        <div class="window" style="top:60px;left:25px"></div>
        <div class="window" style="top:60px;right:25px"></div>

        <div class="window" style="top:150px;left:25px"></div>
        <div class="window" style="top:150px;right:25px"></div>

        <div class="window" style="top:240px;left:25px"></div>
        <div class="window" style="top:240px;right:25px"></div>

    </div>


    <!-- TRUMP -->

    <div
        class="character trump"
        onclick="characterClick('Trump')"
    >

        <div class="face">
            🧑🏼
        </div>

        <div class="name">
            Donald Trump
        </div>

    </div>


    <!-- PUTIN -->

    <div
        class="character putin"
        onclick="characterClick('Putin')"
    >

        <div class="face">
            👨🏼
        </div>

        <div class="name">
            Vladimir Putin
        </div>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver">

        <div class="result">

            <h2>🎮 HẾT GIỜ!</h2>

            <p>
                Điểm của bạn:
                <strong id="finalScore">0</strong>
            </p>

            <button onclick="startGame()">
                CHƠI LẠI
            </button>

        </div>

    </div>

</div>


<p class="instructions">
    🟡 Hãy click thật nhanh vào các mục tiêu xuất hiện trên màn hình!
</p>


<script>

let score = 0;
let time = 30;

let gameRunning = false;

let timerInterval;
let targetInterval;


/* =========================
   START GAME
========================= */

function startGame() {

    score = 0;
    time = 30;

    gameRunning = true;

    document.getElementById("score").innerText = score;
    document.getElementById("time").innerText = time;

    document.getElementById("gameOver").style.display = "none";

    // Xóa target cũ
    document
        .querySelectorAll(".target")
        .forEach(target => target.remove());

    clearInterval(timerInterval);
    clearInterval(targetInterval);

    // Đồng hồ
    timerInterval = setInterval(() => {

        time--;

        document.getElementById("time").innerText = time;

        if (time <= 0) {
            endGame();
        }

    }, 1000);


    // Tạo target
    targetInterval = setInterval(() => {

        createTarget();

    }, 600);


    createTarget();
}


/* =========================
   CREATE TARGET
========================= */

function createTarget() {

    if (!gameRunning) return;

    const game = document.getElementById("game");

    const target = document.createElement("div");

    target.className = "target";

    // Vị trí ngẫu nhiên
    const maxX = game.clientWidth - 60;
    const maxY = game.clientHeight - 100;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    target.style.left = x + "px";
    target.style.top = y + "px";


    target.onclick = function(event) {

        event.stopPropagation();

        score++;

        document.getElementById("score").innerText = score;

        target.remove();
    };


    game.appendChild(target);


    // Nếu không click thì tự biến mất
    setTimeout(() => {

        if (target.parentNode) {
            target.remove();
        }

    }, 1200);
}


/* =========================
   CHARACTER CLICK
========================= */

function characterClick(name) {

    if (!gameRunning) return;

    score += 2;

    document.getElementById("score").innerText = score;

}


/* =========================
   END GAME
========================= */

function endGame() {

    gameRunning = false;

    clearInterval(timerInterval);
    clearInterval(targetInterval);

    document
        .querySelectorAll(".target")
        .forEach(target => target.remove());

    document.getElementById("finalScore").innerText = score;

    document.getElementById("gameOver").style.display = "flex";
}

</script>

</body>
</html>
